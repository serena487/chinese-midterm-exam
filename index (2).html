<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고급중국어 해석 연습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 한 장씩 넘기는 학습 카드 + 상단 지문 선택 바. 청자(靑瓷) 유약 톤의 차분한 녹청 + 낙관(印) 붉은색은 오답 표시에만 */
:root {
  --bg: #eef2f0;
  --surface: #fbfcfb;
  --ink: #1c2724;
  --muted: #5f6f6a;
  --line: #d3ddd9;
  --accent: #2c6b62;
  --accent-soft: #dcebe7;
  --seal: #a8392c;
  --ok: #2f7a45;
  --warn: #9a6a12;
  --hl: #e7efe3;
  --f-zh: 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif;
  --f-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #19211e; --ink: #e3ebe8; --muted: #93a49e; --line: #2c3833;
  --accent: #6fb8ac; --accent-soft: #20332f; --seal: #e07a6b; --ok: #7cc493; --warn: #d9ad55; --hl: #233029; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #19211e; --ink: #e3ebe8; --muted: #93a49e; --line: #2c3833;
  --accent: #6fb8ac; --accent-soft: #20332f; --seal: #e07a6b; --ok: #7cc493; --warn: #d9ad55; --hl: #233029; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -0.2px; text-wrap: balance; }
h1 .zh { font-family: var(--f-zh); font-weight: 600; color: var(--accent); margin-right: 6px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--f-ui); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--f-ui); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.chip .zh { font-family: var(--f-zh); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip small { color: var(--muted); font-family: var(--f-mono); margin-left: 3px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.opts label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.progress { display: flex; align-items: center; gap: 10px; font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.track { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); letter-spacing: .3px; }
.meta .src { font-family: var(--f-zh); }
.state { font-weight: 600; }
.state.ok { color: var(--ok); } .state.mid { color: var(--warn); } .state.bad { color: var(--seal); }
.zh-sent { font-family: var(--f-zh); font-size: 22px; line-height: 1.85; letter-spacing: .5px; word-break: break-all; }
.zh-sent .w { border-bottom: 1.5px dotted var(--accent); cursor: pointer; border-radius: 2px; }
.zh-sent .w:hover, .zh-sent .w:focus-visible { background: var(--hl); outline: none; }
.zh-sent.nohint .w { border-bottom-color: transparent; cursor: text; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.gloss span { background: var(--hl); border-radius: 6px; padding: 3px 8px; font-size: 13px; }
.gloss b { font-family: var(--f-zh); font-weight: 600; margin-right: 4px; }
.gloss em { font-style: normal; font-family: var(--f-mono); color: var(--accent); margin-right: 5px; }
textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 15px/1.6 var(--f-ui); background: var(--bg); color: var(--ink); }
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ref { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 15.5px; }
.ref .lbl { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: .4px; margin-bottom: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.actions .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--f-ui); padding: 8px 14px; border-radius: 9px; cursor: pointer; }
.btn:focus-visible, .chip:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.g-ok { color: var(--ok); } .btn.g-mid { color: var(--warn); } .btn.g-bad { color: var(--seal); }
.kbd { font: 11px var(--f-mono); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.dz-ans { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dz-ans input { font: 18px var(--f-mono); padding: 8px 12px; width: 180px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
.zh-sent u { text-decoration: none; background: var(--accent-soft); border-bottom: 2.5px solid var(--accent); padding: 0 2px; }
.verdict { font-size: 15px; }
.verdict .py { font-family: var(--f-mono); font-size: 17px; color: var(--accent); }
.verdict.wrong .mark { color: var(--seal); } .verdict.right .mark { color: var(--ok); }
.note { font-size: 13px; color: var(--muted); }
.tabs .cnt { font: 11px var(--f-mono); margin-left: 4px; padding: 0 5px; border-radius: 8px; background: var(--seal); color: var(--surface); }
.tabs .cnt:empty { display: none; }
.note-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.note-head h2 { font-size: 16px; margin: 0; font-weight: 600; }
.note-head h2 small { color: var(--muted); font: 13px var(--f-mono); margin-left: 6px; }
.nlist { display: flex; flex-direction: column; gap: 10px; }
.nitem { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--seal); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nitem.mid { border-left-color: var(--warn); }
.nitem .zh-sent { font-size: 17px; line-height: 1.75; }
.nitem .row { font-size: 14px; }
.nitem .row .lbl { display: inline-block; min-width: 62px; margin-right: 6px; font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
.nitem .mine { color: var(--seal); }
.nitem .py { font-family: var(--f-mono); color: var(--accent); }
.nitem .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.btn.sm { font-size: 12.5px; padding: 5px 10px; }
footer { font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (max-width: 480px) { .zh-sent { font-size: 19px; } .card { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1><span class="zh">高级汉语</span>해석 연습</h1>
    <div class="tabs" role="tablist">
      <button id="tab-tr" role="tab" aria-selected="true">문장 해석</button>
      <button id="tab-dz" role="tab" aria-selected="false">다음자</button>
      <button id="tab-note" role="tab" aria-selected="false">오답 노트<span class="cnt" id="cnt"></span></button>
    </div>
  </header>

  <div class="bar" id="filters"></div>
  <div class="opts" id="opts">
    <label><input type="checkbox" id="opt-shuffle"> 무작위 순서</label>
    <label id="lbl-retry"><input type="checkbox" id="opt-retry"> 오답만 다시 풀기</label>
    <label id="lbl-hint"><input type="checkbox" id="opt-hint" checked> 단어 힌트 (점선 단어 누르기)</label>
  </div>
  <div class="progress" id="progress"><span id="pos">1 / 1</span><div class="track"><i id="prog"></i></div></div>

  <section id="view-tr" class="card" aria-live="polite"></section>
  <section id="view-dz" class="card" hidden></section>
  <section id="view-note" hidden></section>

  <div class="stats" id="stats"></div>
  <footer>
    참고 해석은 업로드한 과제 파일의 해석을 바탕으로 오역·오타를 일부 다듬은 것입니다. 시험 답안은 수업 시간에 다룬 해석을 우선하세요.<br>
    오답 노트: 해석에서 ‘애매·다시’를 누른 문장과 다음자에서 틀린 문제가 자동으로 모이고, ‘외웠어요’를 누르면 빠집니다. 기록은 이 브라우저에만 저장됩니다.<br>
    단축키: <span class="kbd">Ctrl+Enter</span> 해석 보기 · <span class="kbd">1 2 3</span> 채점 · <span class="kbd">← →</span> 이동 (입력창 밖에서)
  </footer>
</div>

<script>
const DATA = [{"key": "气功养生", "title": "揭开养生帷幕", "author": "王凌波", "items": [{"zh": "气功中的“气”和“意念”是什么意思？", "ko": "기공에서의 ‘기’와 ‘의념’은 무슨 의미인가?", "spans": [[9, 2, 48]]}, {"zh": "你了解太极拳里蕴涵的哲学思想吗？", "ko": "당신은 태극권 속에 내포된 철학 사상을 이해하는가?", "spans": []}, {"zh": "“动—静”、“刚—柔”这些哲学思想对中国人的生活有什么影响？", "ko": "‘움직임과 고요함’, ‘강함과 부드러움’ 같은 철학 사상은 중국인의 생활에 어떤 영향을 미치는가?", "spans": []}, {"zh": "揭开养生帷幕", "ko": "양생의 장막을 걷다", "spans": [[2, 2, 0], [4, 2, 1]]}, {"zh": "我可以自豪地说：我算得上是一个健康老人。", "ko": "나는 자랑스럽게 말할 수 있다. 나는 건강한 노인이라고 할 만하다.", "spans": [[9, 3, 2]]}, {"zh": "在茫茫人海，在崎岖的生活道路上，我遇到过多少坎坷不平，多少不幸遭遇，如今尝尽人生悲欢，走到了耄耋之年。", "ko": "망망한 인파 속에서, 험난한 삶의 길 위에서 나는 얼마나 많은 고난과 불행을 만났던가. 이제 인생의 기쁨과 슬픔을 다 맛보고 여든, 아흔의 나이에 이르렀다.", "spans": [[1, 2, 3], [7, 2, 4], [22, 2, 5], [29, 2, 6], [46, 2, 7]]}, {"zh": "幸运的是，我虽无金屋豪宅，美味佳肴，却拥有金钱买不到的健康陪伴着我。", "ko": "다행인 것은, 나는 비록 호화로운 집도 맛있는 음식도 없지만, 돈으로 살 수 없는 건강이 나와 함께하고 있다는 것이다.", "spans": [[0, 2, 8], [13, 4, 9], [29, 2, 10]]}, {"zh": "近年来，不乏同龄人向我咨询有关保健长寿的事，好像我有什么秘诀似的。", "ko": "최근 몇 년간, 마치 내게 무슨 비결이라도 있는 것처럼 건강 관리와 장수에 관해 내게 묻는 동년배가 적지 않다.", "spans": [[5, 1, 11], [11, 2, 12], [15, 2, 13], [28, 2, 14]]}, {"zh": "其实，我没什么秘诀，我只想坦率真诚地向人们摊开我的生活，让人们从中获得启示。", "ko": "사실 나에게 무슨 비결은 없다. 나는 그저 솔직하고 진실하게 사람들에게 내 생활을 펼쳐 보여, 사람들이 그 속에서 깨우침을 얻게 하고 싶을 뿐이다.", "spans": [[7, 2, 14], [13, 2, 15], [15, 2, 16], [35, 2, 17]]}, {"zh": "我有强烈的生存欲望，明知道生途多艰险，却偏要去冒险。", "ko": "나에게는 강렬한 생존 욕망이 있어서, 삶의 길이 험난하다는 것을 뻔히 알면서도 굳이 위험을 무릅쓰려 한다.", "spans": [[7, 2, 18], [10, 2, 19], [16, 2, 20], [23, 2, 21]]}, {"zh": "就如同乘一叶扁舟，淋雨沐风，经受过多少次浪涌涛掀，但我硬是冲出来，变得更坚强了。", "ko": "마치 작은 조각배를 타고 비바람을 맞으며 수없이 밀려오는 파도를 겪은 것과 같지만, 나는 끝내 뚫고 나와 더욱 강인해졌다.", "spans": [[6, 2, 22]]}, {"zh": "我爱大地，更爱人类；我爱大自然，更爱生活。", "ko": "나는 대지를 사랑하지만 인류를 더 사랑하고, 대자연을 사랑하지만 삶을 더 사랑한다.", "spans": []}, {"zh": "我痛惜同龄人的衰弱、萎缩与早逝，遂以坚强的意志力和死亡搏斗。", "ko": "나는 동년배들이 쇠약해지고 위축되고 일찍 세상을 떠나는 것을 몹시 애석하게 여겨, 마침내 강인한 의지력으로 죽음과 싸웠다.", "spans": [[10, 2, 23], [27, 2, 24]]}, {"zh": "要做人中的强者，首先要学会生活。", "ko": "사람들 가운데 강자가 되려면 먼저 사는 법을 배워야 한다.", "spans": []}, {"zh": "在我，生活是生命的具体化，是生命的意义和价值的演示场。", "ko": "나에게 있어 생활은 생명의 구체화이며, 생명의 의미와 가치를 보여 주는 무대이다.", "spans": [[23, 2, 25]]}, {"zh": "因此，我必须严肃地对待生活。我是一个严格的“自律主义”者，遵守着符合社会要求的戒律和自定的习惯规律。", "ko": "그래서 나는 반드시 진지하게 삶을 대해야 한다. 나는 엄격한 ‘자율주의자’로서, 사회의 요구에 부합하는 계율과 스스로 정한 습관과 규칙을 지키고 있다.", "spans": [[22, 2, 26], [32, 2, 27]]}, {"zh": "我的原则是名誉第一，情操至上，力求做到热情、积极、认真负责与公正；", "ko": "나의 원칙은 명예가 첫째이고 정조(품성)가 최고라는 것이며, 열정적이고 적극적이며 성실하게 책임지고 공정하도록 힘쓴다.", "spans": [[5, 2, 28], [12, 2, 29]]}, {"zh": "对大自然抱以虔敬之心，对人抱以忠诚之心；至于自己，则心怀坦荡，豁达乐观，不计名利，不计得失，乐得自在逍遥。", "ko": "대자연에 대해서는 경건한 마음을 품고, 사람에 대해서는 충성스러운(진실한) 마음을 품는다. 나 자신에 대해서는 마음을 넓고 떳떳하게 하고, 활달하고 낙관적이며, 명리를 따지지 않고 득실을 따지지 않으며, 자유롭고 유유자적함을 즐긴다.", "spans": [[6, 2, 30], [28, 2, 31], [31, 2, 32], [38, 2, 33], [43, 2, 34], [48, 2, 35], [50, 2, 36]]}, {"zh": "我就是以这样的心态走进生活的。", "ko": "나는 바로 이러한 마음가짐으로 삶 속으로 걸어 들어왔다.", "spans": []}, {"zh": "“助人为快乐之本”、“有恒为成功之本”是我少年时期接受的校训，现在我依旧秉承此训，只是胸怀心境更为博大了。", "ko": "‘남을 돕는 것은 즐거움의 근본이다’, ‘꾸준함은 성공의 근본이다’는 내가 소년 시절에 받은 교훈인데, 지금도 나는 여전히 이 교훈을 받들고 있으며, 다만 품은 뜻과 마음이 더욱 넓어졌을 뿐이다.", "spans": [[36, 2, 38], [43, 2, 39], [45, 2, 40], [49, 2, 41]]}, {"zh": "对长寿充满自信恐怕是健康的秘诀之一。", "ko": "장수에 대해 자신감이 가득한 것이 아마 건강의 비결 중 하나일 것이다.", "spans": [[13, 2, 14]]}, {"zh": "遗憾的是，我见到大多数的同龄人弯着腰、驼着背、缓着步、喘着气，并喟然叹曰：“老了，日薄西山了，气息奄奄了。”“人到暮年，老无所用了。”", "ko": "유감스럽게도 나는 대부분의 동년배들이 허리를 구부리고, 등이 굽고, 느릿느릿 걷고, 숨을 헐떡이며 탄식하는 것을 본다. \"늙었어, 해가 서산에 지는구나, 숨이 곧 끊어질 것 같아.\" \"사람이 노년에 이르니 늙어서 쓸모가 없어.\"", "spans": [[41, 4, 44], [47, 4, 45], [57, 2, 46]]}, {"zh": "该怎样扭转这种“短命意识”和悲观情绪呢？", "ko": "이런 ‘단명 의식’과 비관적인 정서를 어떻게 돌려놓아야 할까?", "spans": []}, {"zh": "我接受并十分珍惜那个气功术语：“意念”。意念能发出物质性的力量。", "ko": "나는 ‘의념’이라는 기공 용어를 받아들이고 매우 소중히 여긴다. 의념은 물질적인 힘을 낼 수 있다.", "spans": [[12, 2, 47], [16, 2, 48], [20, 2, 48]]}, {"zh": "人要有良性意念，摒弃不良意念。你的意念健康，健康就会陪伴在你的身边。", "ko": "사람은 좋은 의념을 가지고 나쁜 의념을 버려야 한다. 당신의 의념이 건강하면, 건강은 곧 당신 곁에 함께할 것이다.", "spans": [[5, 2, 48], [8, 2, 49], [12, 2, 48], [17, 2, 48], [26, 2, 10]]}, {"zh": "当然，光有良性意念，健康是会落空的。重要的是，结合良性意念进行锻炼。", "ko": "물론, 좋은 의념만 있으면 건강은 허사가 될 것이다. 중요한 것은 좋은 의념과 결합하여 단련하는 것이다.", "spans": [[7, 2, 48], [14, 2, 65], [27, 2, 48]]}, {"zh": "先从体操做起，打个太极拳，学套五禽戏，做点儿柔软健身操，不久就会提高你的“体能”。", "ko": "먼저 체조부터 시작해서, 태극권을 하고, 오금희 한 세트를 배우고, 유연 체조를 좀 하면, 머지않아 당신의 ‘체력’이 향상될 것이다.", "spans": []}, {"zh": "在一定的体能基础上进行气功的练习，你的身心就会起一定的变化。", "ko": "어느 정도의 체력을 기초로 기공을 연습하면, 당신의 몸과 마음에는 어느 정도 변화가 일어날 것이다.", "spans": []}, {"zh": "气功重在性命双修，身心并练，动静配合。", "ko": "기공은 성(정신)과 명(육체)을 함께 수련하고, 몸과 마음을 함께 단련하며, 움직임과 고요함을 조화시키는 데 중점을 둔다.", "spans": []}, {"zh": "我的经验是，“静”是养生的关键。静意味着休止，意味着封闭，意味着少消耗能源。", "ko": "내 경험으로는 ‘고요함’이 양생의 관건이다. 고요함은 멈춤을 의미하고, 닫음을 의미하며, 에너지를 적게 소모함을 의미한다.", "spans": [[10, 2, 0], [20, 2, 50]]}, {"zh": "遗憾的是，人们太浪费能源了，不知道合理地节约地使用，以致一生忙碌，却都是毫无价值、毫无意义的。", "ko": "유감스럽게도 사람들은 에너지를 너무 낭비하고, 합리적으로 절약하며 쓸 줄 몰라서, 그 결과 일생을 바쁘게 살지만 모두 조금의 가치도, 조금의 의미도 없는 것이 되고 만다.", "spans": [[26, 2, 58]]}, {"zh": "因此，我说，宁静是养生的另一秘诀。", "ko": "그러므로 나는 평온함(고요함)이 양생의 또 다른 비결이라고 말한다.", "spans": [[9, 2, 0], [14, 2, 14]]}, {"zh": "近十年来，我的健康，我的工作与学习，我的处事与做人，得益于静者良多。", "ko": "최근 10년 동안 나의 건강, 나의 일과 공부, 나의 일 처리와 처신은 고요함에서 얻은 덕이 매우 많다.", "spans": []}, {"zh": "我很容易入静，一放下工作与学习，瞬间就变成另外一个人。", "ko": "나는 아주 쉽게 고요함에 들어간다. 일과 공부를 내려놓기만 하면 순식간에 다른 사람이 된다.", "spans": [[16, 2, 51]]}, {"zh": "我做到拿得起、放得下，定时、定性、定量地学习与工作，坚持守时、准时、及时。", "ko": "나는 잡을 줄도 알고 내려놓을 줄도 알며, 정해진 시간에, 정해진 성격으로, 정해진 양만큼 공부하고 일하며, 시간을 지키고, 정시에, 제때 하는 것을 견지한다.", "spans": []}, {"zh": "可是，我的同龄老友多在叹息：“我就是静不下来，脑子里老在翻云起雾，真难摆脱。”", "ko": "그런데 내 동년배 오랜 친구들은 대부분 탄식한다. \"나는 도무지 마음이 가라앉지 않아. 머릿속이 늘 복잡해서(구름이 뒤집히고 안개가 일어서) 정말 벗어나기 어려워.\"", "spans": []}, {"zh": "仔细分析，他们位高权大，既得利益太多，怎么舍得放下！可是既不肯舍，又怎能得？空的境界，何其难达！", "ko": "자세히 분석해 보면, 그들은 지위가 높고 권력이 커서 이미 얻은 이익이 너무 많으니 어찌 아까워하지 않고 내려놓겠는가! 그러나 버리려 하지 않으면서 또 어찌 얻을 수 있겠는가? ‘공(空)’의 경지는 얼마나 도달하기 어려운가!", "spans": [[14, 2, 52]]}, {"zh": "因此，摈除功名利禄之心，洗涤你的灵魂，对一切均以平常心视之，这就是养生。", "ko": "따라서 공명과 이록을 탐하는 마음을 버리고, 당신의 영혼을 깨끗이 씻어, 모든 것을 평상심으로 바라보는 것, 이것이 바로 양생이다.", "spans": [[6, 2, 33], [12, 2, 56], [33, 2, 0]]}]}, {"key": "感觉", "title": "感觉", "author": "冯骥才", "items": [{"zh": "黄昏时听音乐是一种特殊享受。", "ko": "황혼 때 음악을 듣는 것은 일종의 특별한 즐거움이다.", "spans": []}, {"zh": "那当儿，暮色浓深，屋里的一切都迷蒙模糊，没有什么具体清晰地形象映入眼睑，搅乱头脑；", "ko": "그때는 저녁빛이 짙어 방 안의 모든 것이 흐릿하고 모호해서, 어떤 구체적이고 뚜렷한 형상도 눈에 비쳐 들어와 머리를 어지럽히지 않는다.", "spans": [[15, 2, 57]]}, {"zh": "心灵才能让听觉牵着梦游一般地飘入音乐的境界中去。", "ko": "마음은 비로소 청각으로 하여금 꿈을 꾸듯이 음악의 경지로 흘러들어 가게 한다.", "spans": []}, {"zh": "哎，你是不是也有此同感？", "ko": "아, 너도 이러한 기분에 동감하는가?", "spans": []}, {"zh": "我这感觉既强烈又奇妙，以致我怀疑自己有点儿神经质。", "ko": "나의 이 느낌은 강렬하면서도 기묘해서, 내가 좀 신경과민이 아닌가 의심할 정도이다.", "spans": [[11, 2, 58]]}, {"zh": "记得那次绝对是个黄昏，大概听舒曼的《梦幻曲》吧！", "ko": "그때는 틀림없이 황혼이었고 아마 슈만의 <<몽환곡>>을 듣고 있었을 거다!", "spans": []}, {"zh": "家里只我自己，静静的空间灌满了那深沉而醉心的琴音。", "ko": "집에는 나 혼자였고 조용한 공간이 낮고 매혹적인 피아노 선율로 가득 찼다.", "spans": []}, {"zh": "屋子的四角都黑了，窗前的东西变成一堆分辨不清的影子，只有窗玻璃上还依稀映着一点淡淡的橘色的夕照。", "ko": "집 안은 온통 어두워졌고 창가의 물건은 분간할 수 없는 그림자로 변했고 창유리 위에는 아직 옅은 주황색의 저녁빛이 비치고 있었다.", "spans": [[33, 2, 59]]}, {"zh": "我的心像被这音乐洗过一样圣洁。", "ko": "내 마음은 마치 이 음악에 씻긴 듯 성결해졌다.", "spans": []}, {"zh": "不知是心沉浸在琴音里，还是琴音充溢我的心里，一股潜流似地婉转回旋。", "ko": "마음이 피아노 소리에 잠긴 것인지, 아니면 피아노 소리가 내 마음에 가득 차 넘친 것인지, 한 줄기 저류처럼 부드럽게 굽이치며 맴돌았다.", "spans": [[15, 2, 60], [24, 2, 62], [30, 2, 61]]}, {"zh": "于是我被感动起来，随之而来，便是这种种动心的感觉渐渐加强，心里的潜流形成一个疾转的漩涡，到了感动的潮头卷起，我忽然不能自已。", "ko": "그래서 나는 감동하기 시작했고, 뒤이어 마음을 움직이는 갖가지 느낌이 점점 강해졌다. 마음속 저류는 빠르게 도는 소용돌이를 이루었고, 감동의 물결이 말려 올라오자 나는 갑자기 스스로를 억제할 수 없었다.", "spans": [[32, 2, 62], [41, 2, 63]]}, {"zh": "好像有根无形的搅棒，把沉淀心底的乱七八糟的全都翻腾起来。", "ko": "마치 형태가 없는 막대기로 마음속 깊이 가라앉은 온갖 것들을 모두 휘져어 올리는 듯했다.", "spans": [[11, 2, 64]]}, {"zh": "说不出是什么难忘的事或感受过的情绪，也说不出是什么滋味，甜蜜？忧伤？思念？委屈？已经落空的企盼？留不住的甜美……", "ko": "그것이 무슨 잊을 수 없는 일인지, 예전에 느꼈던 감정인지 말할 수 없고, 어떤 맛인지도 말할 수 없었다. 달콤함? 슬픔? 그리움? 서러움? 이미 수포로 돌아간 간절한 바람? 붙잡아 둘 수 없는 달콤함……", "spans": [[42, 2, 65], [45, 2, 66]]}, {"zh": "一下子，大滴大滴的泪珠子竟然自个儿夺眶而出，滚过脸颊，啪啪掉在地上。", "ko": "순간, 굵은 눈물방울이 뜻밖에도 저절로 왈칵 쏟아져 나와 뺨을 타고 굴러 바닥에 톡톡 떨어졌다.", "spans": [[17, 4, 67]]}, {"zh": "我倚着门框，仰起头，衣襟很快就湿了一片。", "ko": "나는 문틀에 기대어 고개를 쳐들었고, 옷섶은 금세 한쪽이 흠뻑 젖었다.", "spans": [[10, 2, 68]]}, {"zh": "我完全不能自制，也不想自制，因为这绝不是一种痛苦，而是一种异常的、令人颤栗的幸福的感觉。", "ko": "나는 전혀 자제할 수 없었고 자제하고 싶지도 않았다. 이것은 결코 고통이 아니라, 남다르고 사람을 전율하게 하는 행복한 느낌이었기 때문이다.", "spans": [[5, 2, 69], [11, 2, 69], [35, 2, 70]]}, {"zh": "平日里偶然给什么意外的事物的触发，也会生出这样一种感觉，却总是一掠而过，从来没有凝聚起来，这样有力地撞击我的心扉。", "ko": "평소에 우연히 어떤 의외의 사물의 촉발에 의해서 이러한 감정이 생기기도 하지만 항상 스쳐 지나갈 뿐 응집되어 이렇게 강력하게 내 마음의 문을 두드린 적은 없었다.", "spans": [[14, 2, 71], [40, 2, 72]]}, {"zh": "然而我不明白，这感觉是怎样来的，是那琴音招引来的？ 到底是哪个旋律、哪个和声打动的我？", "ko": "그러나 나는 이런 감정이 어떻게 생겨났는지 알 수 없었다. 그 피아노 선율이 불러온 것인가? 도대체 어떤 선율, 어떤 화성이 나를 감동시킨 것인가?", "spans": [[20, 2, 73]]}, {"zh": "为什么以前听这曲子从无这般感受？", "ko": "어째서 예전에는 이 곡을 들었을 때 이와 같은 느낌을 받은 적이 한번도 없었는가?", "spans": []}, {"zh": "更奇怪的是，这以后，多少次，黄昏时，我设法支开家里的人，依旧在这光线晦暗、阴影重重的安寂的小屋里，独自倚门倾听这支曲子，但再也不曾出现那种忍俊不禁、苦乐交加的感觉了，琴音像一阵微弱的风，难得再在我心中吹起浪头。怎么回事？", "ko": "더 이상한 것은 그 이후 몇 차례나 황혼 무렵에 구실을 만들어서 가족들을 내보내고 여전히 빛이 어둡고 어두운 그림자가 가득한 조용한 작은 방에서 혼자 문에 기대어 이 곡에 귀기울였으나 참을 수 없이 웃음이 나올 듯하고 고통과 즐거움이 뒤섞인 그런 느낌이 다시는 나타나지 않았다. 피아노 선율은 마치 미약한 바람처럼 내 맘속에서 다시 파도를 일으키기 어려웠다. 왜 그런 걸까?", "spans": [[34, 2, 74], [69, 4, 75], [74, 4, 76], [101, 3, 77]]}, {"zh": "感觉是找不到的，只有它来找你。", "ko": "느낌은 찾아지는 것이 아니다. 오직 그것이 너를 찾아올 뿐이다.", "spans": []}, {"zh": "两年后，我早已忘掉寻觅这种感觉的念头，却意外碰到了它。", "ko": "2년 후, 나는 이 느낌을 찾으려는 생각을 이미 잊은 지 오래였는데, 뜻밖에 그것과 마주쳤다.", "spans": []}, {"zh": "那是个深秋的时节，刚刚下过一场蒙蒙小雨，天色将暮，人在户外，脸颊和双手都感到微微凉意。", "ko": "그건 늦가을 무렵 방금 한 차례 보슬비가 내린 참이었고 해질녁 야외에 있었는데 뺨과 두 손에 약간의 한기가 느껴졌다.", "spans": []}, {"zh": "我才办完一件事回家，走在一条沿河的小道上。", "ko": "나는 막 일을 마치고 집에 돌아가는 길이었고 강을 따라 난 작은 길을 걷고 있는 중이었다.", "spans": []}, {"zh": "小河在左边，蜿蜒又清亮，缓斜的泥坡三三五五坐着一些垂柳；", "ko": "왼편에는 강이 있었는데 구불구불하며 맑았고 경사가 완만한 기슭에는 버드나무들이 삼삼오오 서 있었다;", "spans": []}, {"zh": "右边是一面石砌的高墙，不知道是哪家豪门显贵的宅院。", "ko": "오른편에는 돌로 쌓은 담장이 있었는데 어느 권문세가의 저택인지는 알 수 없었다.", "spans": []}, {"zh": "这石墙很长，向前延长很远。", "ko": "그 돌담은 매우 길어서 앞으로 멀리 뻗어 있었다.", "spans": []}, {"zh": "院内一些老杨树把它巨大的伞状的树冠伸出墙来。", "ko": "저택 안에는 몇 그루의 오래된 백양나무가 거대한 우산 모양의 커다란 수관(나무꼭대기)을 담 밖으로 내밀고 있었다.", "spans": []}, {"zh": "树上的叶子正在脱落，地上积了厚厚一层，枝上挂的不多。", "ko": "나무 위의 나뭇잎은 떨어져서 바닥에 두껍게 깔렸고 가지에 메달린 것은 많지 않았다.", "spans": []}, {"zh": "显然无风，不时有一片巴掌大的褐色叶子，自个儿脱开枝干，从半空中打着各式各样的旋儿忽悠落下来，落在地上的叶子中间，立时混在一起，分不开来。", "ko": "분명 바람은 없는데 이따금 손바닥만 한 갈색 잎이 가지에서 떨어져서 각양각색의 움직임으로 공중에서 선회하다 흔들흔들 떨어지자 바닥에 있는 나뭇잎 사이에 바로 섞여 더 이상 구분할 수 없게 되었다.", "spans": [[40, 2, 78]]}, {"zh": "大树也就立刻显得轻松一些似的。", "ko": "큰 나무는 바로 홀가분해진 것처럼 보였다.", "spans": []}, {"zh": "我踏着这落叶走，忽然发现一片叶子，异常显眼，它比较一般叶子稍小，崭新油亮，分明是一片新叶。", "ko": "나는 낙엽을 밟으며 걸었는데 갑자기 잎새 하나가 유난히 눈길을 끌었다. 그것은 보통의 잎사귀보다 조금 작았고 새롭게 반들반들 한 것이 틀림없는 새 잎이었다.", "spans": [[32, 2, 79]]}, {"zh": "可惜它生不逢时，没有长足、胀满它每一个生命的细胞，散尽它的汁液与幽香，就早早随同老叶一同飘落。", "ko": "안타깝게도 그것은 때를 잘못 타고나, 충분히 자라 생명의 세포 하나하나를 가득 채우지도, 자신의 즙과 그윽한 향기를 다 풍기지도 못한 채 일찌감치 묵은 잎들과 함께 흩날려 떨어졌다.", "spans": [[44, 2, 80]]}, {"zh": "可是，大自然已经不可逆地到了落叶时节，谁又管它这一片无足轻重的叶子呢！", "ko": "그러나 대자연은 이미 되돌릴 수 없게 낙엽의 계절에 이르렀으니, 누가 이 대수롭지 않은 잎 한 장에 신경을 쓰겠는가!", "spans": [[26, 4, 81]]}, {"zh": "我看见，这涂了一层蜡似的翠绿的叶面上汪着几滴晶亮的水珠，兴许是刚才的雨滴，却正像它无以言传的伤心的泪。", "ko": "나는 이 왁스를 바른 듯한 진초록 잎새 위에 투명하고 반짝이는 물방울이 몇 방울 맺혀 있는 걸 보았다. 아마도 방금 내린 빗방울일테지만 그것은 마치 말로 전할 수 없는 슬픈 눈물처럼 보였다.", "spans": []}, {"zh": "它多么期望在这树上多多流连一刻。", "ko": "그것은 이 나무 위에 조금이라도 더 머물기를 얼마나 바랐을까.", "spans": [[11, 2, 82]]}, {"zh": "生活，尽管给生命许许多多折磨、苦涩、烦恼、欺骗和不幸，谁愿意丢弃它？", "ko": "비록 삶이 생명에게 수많은 괴로움, 고통, 번뇌, 기만과 불행을 주지만 누가 그것을 버리고자 하겠는가?", "spans": [[15, 2, 83], [24, 2, 6]]}, {"zh": "甚至依旧甘心把一切奉献给它。", "ko": "심지어 여전히 자신의 모든 것을 기꺼이 그것에게 바친다.", "spans": []}, {"zh": "生活，你拿什么偿还一切生命对你的奉献？永远是希望吗？", "ko": "삶아, 너는 생명이 바친 모든 것에 대해서 무엇으로 갚을 것인가? 영원히 희망인가?", "spans": []}, {"zh": "我怜惜地拾起这片绿叶，抬眼一望，蓦然发现高高的、雨淋湿而发暗的墙头上，趴着一只雪白的猫，呆呆瞧着我；", "ko": "나는 안타까운 마음으로 이 초록잎을 줏어들고 눈을 들어 바라보자 갑자기 높고도 비에 젖어 검게된 담 위에 눈처럼 흰 고양이 한 마리가 엎드린 채 멍하니 나를 바라보고 있는 걸 발견했다.", "spans": [[1, 2, 84], [16, 2, 85]]}, {"zh": "杨树深处，有两扇玻璃窗反映着雨后如洗的蓝天，好像躲在暗处的一双美丽的眼睛……", "ko": "백양나무 깊은 곳에는 비가 온 뒤 씻은듯 파란 하늘을 비추고 있는 유리창이 두 짝 있었는데 마치 어둠 속에 숨은 아름다운 눈동자 같았다.", "spans": []}, {"zh": "突然，就是这突然的一下，我被莫名地感动起来。", "ko": "갑자기, 바로 그 순간, 나는 말로 표현할 수 없는 감동이 일어나기 시작했다.", "spans": []}, {"zh": "那次听音乐时所产生的异常的感觉，又一次涌入我的心中，在我心里翻江倒海地搅动起来，视觉又一次被止不住的大股热泪遮挡住了。", "ko": "그때 음악을 들었을때 생겨난 특별한 느낌이 다시 한번 내 마음속으로 밀려들었고 내 마음속에서 강과 바다가 뒤엎을 기세로 요동을 쳤고 눈 앞은 멈추지 않는 뜨거운 눈물로 시야가 가려졌다.", "spans": [[30, 4, 86]]}, {"zh": "我站在满地褐黄斑驳的落叶中间，贪婪地享受着有甜有苦的情感，并任使这情感尽情发泄和延长，多留它一些时候。", "ko": "나는 황갈색으로 얼룩진 낙엽이 가득한 가운데 서서 달콤하면서도 쓴 감정들을 마음껏 즐기며 그 감정들이 남김없이 발산되고 연장되어서 오래도록 남아있도록 하였다.", "spans": [[7, 2, 87], [15, 2, 88], [37, 2, 89]]}, {"zh": "谁知它只是这一小阵子，转眼竟然雾一般渐渐消散。", "ko": "누가 알았으랴, 그것은 아주 잠깐뿐이었고 눈 깜짝할 사이에 뜻밖에도 안개처럼 점점 흩어져 사라졌다.", "spans": []}, {"zh": "好似一下子都拥聚与凝结起来的事物，又一下子分散开来，抓都抓不着。", "ko": "마치 한순간에 한데 모여 엉겼던 것이 또 한순간에 흩어져 버려, 잡으려 해도 잡을 수 없는 것 같았다.", "spans": []}, {"zh": "咦，这是怎么回事？", "ko": "어, 이게 어떻게 된 일인가?", "spans": []}, {"zh": "我手里拈着这片闪光而早落的叶子，痴呆呆地站着。", "ko": "나는 반짝이며 일찍 떨어진 잎을 손에 든 채 멍하니 서 있었다.", "spans": []}]}, {"key": "学问之趣味", "title": "学问之趣味", "author": "梁启超", "items": [{"zh": "我是个主张趣味主义的人：倘若用化学化分“梁启超”这件东西，把里头所含一种原素名叫“趣味” 的抽出来，只怕所剩下仅有个0了。", "ko": "나는 취미주의를 주장하는 사람이다. 만약 “양치차오”라는 물질을 화학적으로 분석해서 안에 들어 있는 ‘취미’라는 부르는 원소를 뽑아낸다면 남는 것은 아마 0밖에 없을 것이다.", "spans": [[12, 2, 90], [36, 2, 91]]}, {"zh": "我以为：凡人必常常生活于趣味之中，生活才有价值。", "ko": "나는 무릇 사람은 늘상 취미속에서 반드시 생활해야 삶이 가치 있다고 생각한다.", "spans": []}, {"zh": "若哭丧着脸挨过几十年，那么，生命便成沙漠，要来何用？", "ko": "만약 울상을 지은 채 수십 년을 억지로 버티며 산다면, 생명은 곧 사막이 되어 버릴 텐데 그것을 무엇에 쓰겠는가?", "spans": [[1, 4, 92]]}, {"zh": "中国人见面最喜欢用的一句话：“近来作何消遣？”", "ko": "중국 사람들이 만나면 즐겨 쓰는 말이 있다: “요즘 들어 무엇으로 소일을 하시나요?”", "spans": [[19, 2, 93]]}, {"zh": "这句话我听着便讨厌。", "ko": "그 말을 들으면 나는 짜증이 난다.", "spans": []}, {"zh": "话里的意思，好像生活得不耐烦了，几十年日子没有法子过，勉强找些事情来消他遣他。", "ko": "그 말의 의미는 마치 생활하는 게 지겨워서 몇 십년 간의 날들을 잘 지낼 방법이 없어서 억지로 무언가를 찾아 소일을 삼아 삶을 살아가는 것처럼 들리기 때문이다.", "spans": []}, {"zh": "一个人若生活于这种状态之下，我劝他不如早日投海！", "ko": "사람이 만약 이런 상태에서 살아간다면 나는 그 사람에게 일찌감치 바다에 몸을 던지는 것을 권하고 싶다!", "spans": []}, {"zh": "我觉得天下万事万物都有趣味，我只嫌二十四点钟不能扩充到四十八点，不彀我享用。", "ko": "나는 천하의 모든 일과 사물에 다 재미가 있다고 느낀다. 나는 그저 하루 스물네 시간을 마흔여덟 시간으로 늘릴 수 없어서 내가 누리기에 부족한 것이 싫을 뿐이다.", "spans": []}, {"zh": "我一年到头不肯歇息，问我忙什么？", "ko": "나는 일 년 내내 쉬려고 하지 않는다. 나에게 “뭐가 그리 바쁘냐?”라고 묻는다.", "spans": []}, {"zh": "忙的是我的趣味。", "ko": "바쁜 것은 바로 나의 재미이다.", "spans": []}, {"zh": "我以为这便是人生最合理的生活，我常常想运动别人也学我这样生。", "ko": "나는 이것이 인생에서 가장 합리적인 삶이라고 생각하여, 늘 다른 사람들도 나처럼 이렇게 살도록 권하고 싶다.", "spans": []}, {"zh": "凡属趣味，我一概都承认他是好的，但怎么样才算“趣味”，不能不下一个注脚。", "ko": "취미에 속하는 모든 것을 나는 다 좋은 것이라고 인정한다. 근데 어떻게 해야만 ‘취미’라고 할 수 있는지에 대해서는 반드시 부연설명을 하지 않을 수 없다.", "spans": [[9, 2, 94]]}, {"zh": "我说：“凡一件事做下去不会生出和趣味相反的结果的，这件事便可以为趣味的主体。”", "ko": "나는 이렇게 말한다. \"무릇 어떤 일을 계속해 나가도 재미와 반대되는 결과가 생기지 않는다면, 그 일은 취미의 주체가 될 수 있다.\"", "spans": []}, {"zh": "赌钱趣味吗？输了怎么样？吃酒趣味吗？病了怎么样？做官趣味吗？没有官做的时候怎么样？……", "ko": "도박이 취미인가? 잃으면 어떠한가? 술 마시는 게 취미일까? 병이 나면 어떠한가? 관리가 되는 것은 취미인가? 할 관직이 없을 때는 어떠한가? ……", "spans": []}, {"zh": "诸如此类，虽然在短时间内像有趣味，结果会闹到俗语说的“没趣一齐来”，所以我们不能承认他是趣味。", "ko": "이런 것들은 비록 단시간내는 재미가 있는 것 같지만 결과적으로 재미 없는 것이 함께 오는 결과를 초래하기 때문에 그것을 진정한 재미라고 인정할 수 없다.", "spans": [[40, 2, 94]]}, {"zh": "凡趣味的性质，总要以趣味始以趣味终。", "ko": "무릇 취미의 성질은 재미로 시작해서 재미로 마쳐야 한다.", "spans": []}, {"zh": "所以能为趣味之主体者，莫如下列的几项：一，劳作；二，游戏；三，艺术；四，学问。", "ko": "그래서 재미의 주체가 될 수 있는 것은 아래 열거한 몇 가지 항목만 한 것이 없다. 1. 일; 2: 놀이; 3. 예술; 4. 학문", "spans": []}, {"zh": "诸君听我这段话，切勿误会以为 : 我用道德观念来选择趣味。", "ko": "여러분 나의 이 말을 듣고 절대 나는 도덕 관념을 가지고 취미를 선택했다고 여기지 말라.", "spans": [[8, 2, 95]]}, {"zh": "我不问德不德，只问趣不趣。", "ko": "나는 그것이 도덕적인지 비도덕적인지는 따지지 않고 오직 그것이 재미있는지 아닌지만 따진다.", "spans": []}, {"zh": "我并不是因为赌钱不道德才排斥赌钱，因为赌钱的本质会闹到没趣，闹到没趣便破坏了我的趣味主义，所以排斥赌钱；", "ko": "나는 결코 도박이 비도덕적이어서 도박을 배척하는 것이 아니라 도박의 본질이 결국 재미없는 것을 초래하기 때문에 이는 곧 나의 취미주의를 망가뜨리게 되기 때문에 도박을 배척하는 것이다.", "spans": [[12, 2, 96], [47, 2, 96]]}, {"zh": "我并不是因为学问是道德才提倡学问，因为学问的本质能彀以趣味始以趣味终，最合于我的趣味主义条件，所以提倡学问。", "ko": "나는 학문이 도덕적이어서 학문을 제창하는 것이 아니다. 학문의 본질이 재미로 시작해 재미로 마칠 수 있기 때문에 나의 취미주의 조건에 가장 부합되기 때문에 학문을 제창하는 것이다.", "spans": [[12, 2, 97], [49, 2, 97]]}, {"zh": "学问的趣味，是怎么一回事呢？ 这句话我不能回答。", "ko": "학문의 재미는 어떤 것인가? 이 말에는 내가 대답할 수 없다.", "spans": []}, {"zh": "凡趣味总要自己领略，自己未曾领略得到时，旁人没有法子告诉你。", "ko": "무릇 취미는 항상 자신이 느껴서 알아야 하는 것이지 자신이 느껴서 알지 못하게 되었을 때는 옆에 있는 사람이 알려줄 방법이 없다.", "spans": [[7, 2, 98], [14, 2, 98]]}, {"zh": "佛典说的：“如人饮水，冷暖自知。”", "ko": "불경에 “사람이 물을 마시는 것과 같아서 차갑고 따뜻한 것은 스스로 아는 것이다.” 라는 말이 있다.", "spans": []}, {"zh": "你问我这水怎样的冷，我便把所有形容词说尽，也形容不出给你听，除非你亲自喝一口。", "ko": "당신이 나에게 이 물이 얼마나 차갑냐고 묻는다면 당신이 직접 한 모금 마셔보는 것 외에는 나는 모든 형용사를 다 말을 해도 당신에게 형용해서 그것을 알려줄 방법이 없다", "spans": []}, {"zh": "我这题目——学问之趣味，并不是要说学问如何如何的有趣味，只要如何如何便会尝得着学问的趣味。", "ko": "나의 학문의 재미라고 하는 이 제목은 결코 학문이 어떻게 재미있는지를 말하려고 하는 것이 아니다. 그저 어떻게 해야 학문의 재미를 맛볼 수 있는지를 말하고자 할 따름이다.", "spans": [[37, 2, 109]]}, {"zh": "诸君要尝学问的趣味吗？据我所经历过的有下列几条路应走：", "ko": "여러분은 학문의 재미를 맛보고 싶은가? 내 경험에 의하면 다음과 같은 몇 가지 방법을 따라야 한다.", "spans": []}, {"zh": "第一，\"无所为\"（为读去声）：趣味主义最重要的条件是“无所为而为”。", "ko": "첫 번째, 의도하는 바가 없이 그렇게 하라 (여기서 ‘위’는 읽을 때 거성으로 읽는다.) : 취미주의에서 가장 중요한 조건은 “아무 목적 없이 행하는 것”이다.", "spans": []}, {"zh": "凡有所为而为的事，都是以别一件事为目的而以这件事为手段；", "ko": "무릇 의도하는 바가 있어서 하는 일은 모두 다른 일을 목적으로 삼고 이 일을 수단으로 삼는 것이다.", "spans": []}, {"zh": "为达目的起见勉强用手段，目的达到时，手段便抛却。", "ko": "목적을 달성하기 위해서 억지로 수단을 쓰게 되면 목적에 도달했을 때 수단은 버려지게 된다.", "spans": [[21, 2, 99]]}, {"zh": "例如学生为毕业证书而做学问，著作家为版权而做学问，这种做法，便是以学问为手段，便是有所为。", "ko": "예를 들어 학생이 졸업장을 위해 학문을 하고 작가가 판권을 위해 학문을 한다. 이런 방식은 학문을 수단으로 삼는 것이며 곧 의도하는 바가 있는 것이다.", "spans": []}, {"zh": "有所为虽然有时也可以为引起趣味的一种方面，但到趣味真发生时，必定要和“所为者”脱离关系。", "ko": "의도하는 바가 있는 것이 비록 때로는 재미를 불러일으키는 한 방편이 될 수 있다. 그러나 진정한 재미가 발생했을 때는 반드시 그 ‘목적’과의 관계를 벗어나야 한다.", "spans": [[39, 2, 100]]}, {"zh": "你问我“为什么做学问”？ 我便答道：“不为什么”。再问，我便答道：“为学问而学问”；或者答道：“为我的趣味”。", "ko": "당신이 나에게 왜 학문을 한다고 묻는다면 나는 이유가 없다고 대답한다. 다시 묻는다면 “학문을 위해 학문을 한다.” 혹은 “나의 재미를 위해서 이다.”라고 답할 것이다.", "spans": [[42, 2, 101]]}, {"zh": "诸君切勿以为我这些话掉弄玄虚；人类合理的生活本来如此。", "ko": "여러분은 내 이 말들이 일부러 현묘한 척하며 사람을 현혹하는 것이라고 절대 여기지 마라. 인간의 합리적인 삶은 본래 이러하다.", "spans": [[2, 2, 95], [10, 4, 102]]}, {"zh": "小孩子为什么游戏？为游戏而游戏；人为什么生活？为生活而生活。为游戏而游戏，游戏便有趣；", "ko": "어린아이는 왜 놀이를 하는가? 놀이를 위해 놀이를 한다. 사람은 왜 사는가? 삶을 위해 산다. 놀이를 위해 놀이를 하면 놀이가 곧 재미있다.", "spans": []}, {"zh": "为体操分数而游戏，游戏便无趣。", "ko": "체육 점수를 위해 놀이를 한다면 그 놀이는 재미가 없어진다.", "spans": []}, {"zh": "第二，不息：“鸦片烟怎样会上瘾？”“天天吃。”", "ko": "둘째, 쉬지 않는 것: \"아편은 어떻게 중독되는가?\" \"날마다 피우기 때문이다.\"", "spans": [[13, 2, 103]]}, {"zh": "“上瘾”这两个字，和“天天”这两个字是离不开的。", "ko": "‘중독’이라는 두 글자와 ‘날마다’라는 두 글자는 떼려야 뗄 수 없다.", "spans": [[1, 2, 103]]}, {"zh": "凡人类的本能，只要那部分阁久了不用，他便会麻木会生锈。", "ko": "무릇 인간의 본능은 어떤 부분을 오랫동안 방치하고 사용하지 않으면 곧 굳고 녹슬기 마련이다.", "spans": [[12, 1, 104], [24, 2, 105]]}, {"zh": "十年不跑路，两条腿一定会废了；", "ko": "십 년 동안 달리지 않으면 두 다리는 반드시 못 쓰게 된다.", "spans": []}, {"zh": "每天跑一点钟，跑上几个月，一天不得跑时，腿便发痒。", "ko": "날마다 한 시간씩 달려서 몇 달 간을 달린다면 하루라도 달리지 않으면 다리가 근질거릴 것이다.", "spans": [[22, 2, 106]]}, {"zh": "人类为理性的动物，“学问欲”原是固有本能之一种；", "ko": "인간은 이성적인 동물이고 ‘학문 욕구’는 본래 타고난 본능 가운데 하나다.", "spans": []}, {"zh": "只怕你出了学校便和学问告辞，把所有经管学问的器官一齐打落冷宫，把学问的胃弄坏了，便山珍海味摆在面前也不愿意动筷子。", "ko": "당신이 학교를 나간 뒤 학문과 작별을 고해서 학문을 담당하는 모든 기관을 다 한쪽 구석에 몰아넣고 학문의 입맛을 망쳐서 눈앞에 산해진미가 펼쳐져 있어도 젓가락을 들고 싶지 않을까 걱정이다.", "spans": []}, {"zh": "诸君啊！诸君倘若现在从事教育事业或将来想从事教育事业，自然没有问题，很多机会来培养你学问胃口。", "ko": "여러분! 만약에 여러분이 지금 교육 사업에 종사하고 있거나 장차 교육 사업에 종사하려는 생각이라면 문제가 없다. 학문에 대한 욕구를 배양할 기회가 많이 있다.", "spans": [[6, 2, 90], [44, 2, 107]]}, {"zh": "若是做别的职业呢？我劝你每日除本业正当劳作之外，最少总要腾出一点钟，研究你所嗜好的学问。", "ko": "만약 다른 직업에 종사한다면? 나는 날마다 본업의 정당한 일 외에 최소한 한 시간은 빼내 자신이 좋아하는 학문을 연구할 것을 권한다.", "spans": []}, {"zh": "一点钟那里不消耗了？千万别要错过，闹成“学问胃弱”的证候，白白自己剥夺了一种人类应享之特权啊！", "ko": "한 시간쯤 어디에선들 소모하지 않겠는가? 절대 놓치지 마라. ‘학문 위약(胃弱)’ 증세가 생겨, 인간이 마땅히 누려야 할 특권 하나를 헛되이 스스로 박탈하게 되리라!", "spans": [[33, 2, 108]]}, {"zh": "第三，深入的研究：趣味总是慢慢的来，越引越多；", "ko": "셋째, 깊이 들어가는 연구: 재미는 늘 천천히 오며, 이끌어 낼수록 많아진다.", "spans": []}, {"zh": "像倒吃甘蔗，越往下才越得好处。", "ko": "사탕수수를 거꾸로 먹는 것처럼, 아래로 갈수록 더 좋은 맛을 얻는다.", "spans": []}, {"zh": "假如你虽然每天定有一点钟做学问，但不过拿来消遣消遣，不带有研究精神，趣味便引不起来。或者今天研究这样明天研究那样，趣味还是引不起来。", "ko": "만약 당신이 비록 날마다 한 시간을 정해놓고 학문을 하는데 그러나 그것을 소일거리 삼아 하는 것이고 연구 정신을 갖지 않는다면 취미는 이끌어 낼 수 없다. 혹은 오늘은 이것을 연구하고 내일은 저것을 연구한다면 역시 취미를 이끌어 낼 수 없다.", "spans": [[21, 2, 93], [23, 2, 93], [42, 2, 101]]}, {"zh": "趣味总是藏在深处，你想得着，便要入去", "ko": "취미는 항상 깊은 곳에 숨어 있는데 그것을 얻고자 한다면 그 안으로 들어가야 한다.", "spans": [[11, 2, 109]]}, {"zh": "这个门穿一穿，那个窗户张一张，再不会看见“宗庙之美，百官之富”，如何能有趣味?", "ko": "이 문을 한번 열어봤다가 저 창을 들여다봤다 하면 ‘종묘의 아름다움과 백관의 풍요로움’을 볼 수 없을 것이니 어떻게 재미가 있을 수 있겠는가?", "spans": []}, {"zh": "我方才说：“研究你所嗜好的学问”，嗜好两个字很要紧。", "ko": "나는 방금 말했다. “네가 좋아하는 바의 학문을 연구하라” 여기서 ‘좋아한다’는 말이 중요하다.", "spans": []}, {"zh": "一个人受过相当的教育之后，无论如何，总有一两门学问和自己脾胃相合，而已经懂得大概可以作加工研究之预备的。", "ko": "사람이 상당한 교육을 받고 난 다음에는 어떻게 해서든 한 두개 자신과 기호가 맞는 학문이 있기 마련이다. 그리고 이미 대략은 알고 있어 다듬어서 연구할 준비가 되어있다.", "spans": [[28, 2, 110]]}, {"zh": "请你就选定一门作为终身正业（指从事学者生活的人说）或作为本业劳作以外的副业。（指从事其他职业的人说）", "ko": "요청컨대 평생의 본업으로 삼을 걸 하나 정하고 (학자의 길을 걷는 사람이라면), 혹은 본업 일 이외의 부업으로 삼을 것을 하나 선택하라. (기타 직업에 종사하는 사람이라면).", "spans": []}, {"zh": "不怕范围窄，越窄越便于聚精神 ; 不怕问题难，越难越便于鼓勇气。", "ko": "범위가 좁은 것을 두려워하지 마라. 범위가 좁을수록 정신을 집중하기에 더 쉽다. 문제가 어렵다고 두려워하지 마라. 문제가 어려울수록 용기를 북돋우기에 더 좋다.", "spans": []}, {"zh": "你只要肯一层一层的往里面追，我保你一定被他引到“欲罢不能”的地步。", "ko": "당신이 한 층 한 층 안으로 파고들기만 한다면, 당신은 틀림없이 그것에 이끌려 ‘그만두려 해도 그만둘 수 없는’ 경지에 이를 것이라고 내가 보증한다.", "spans": [[24, 4, 111]]}, {"zh": "第四，找朋友：趣味比方电，越摩擦越出。", "ko": "네번째, 친구를 찾아라. 취미는 전기에 비유할 수 있어서 마찰할수록 더 많이 일어난다.", "spans": [[14, 2, 112]]}, {"zh": "前两段所说，是靠我本身和学问本身相摩擦；但仍恐怕我本身有时会停摆，发电力便弱了。所以常常要仰赖别人帮助。", "ko": "앞의 두 단락에서 말한 것은 나 자신과 학문 자체가 서로 마찰하는 데 기대는 것이다. 그러나 나 자신이 때때로 멈춰 버려 발전력이 약해질까 걱정이다. 그래서 자주 다른 사람의 도움에 의지해야 한다.", "spans": [[17, 2, 112], [30, 2, 113], [45, 2, 114]]}, {"zh": "一个人总要有几位共事的朋友，同时还要有几位共学的朋友。", "ko": "사람은 함께 일하는 친구가 몇 명 있어야 하고, 동시에 함께 공부하는 친구도 몇 명 있어야 한다.", "spans": []}, {"zh": "共事的朋友，用来扶持我的职业；共学的朋友和共顽的朋友同一性质，都是用来摩擦我的趣味。", "ko": "함께 일하는 친구는 내 직업을 뒷받침하는 데 쓰이고, 함께 공부하는 친구는 함께 노는 친구와 성질이 같아서 모두 내 재미를 마찰시키는 데 쓰인다.", "spans": [[8, 2, 115], [35, 2, 112]]}, {"zh": "这类朋友，能彀和我同嗜好一种学问的自然最好，我便和他研究。", "ko": "이런 친구들이 나와 좋아하는 학문이 같다면 가장 좋다. 나는 그와 함께 연구할 것이다.", "spans": []}, {"zh": "即或不然——他有他的嗜好，我有我的嗜好，只要彼此都有研究精神，我和他常常在一块或常常通信，便不知不觉把彼此趣味都摩擦出来了。", "ko": "설사 그렇지 않아서 그에게는 그의 기호가 있고 나에게는 나의 기호가 있더라도 서로 연구 정신이 있다면 그와 나는 자주 함께 하거나 서신 왕래를 통해 자연스럽게 서로의 취미가 마찰되어 나타날 것이다.", "spans": [[56, 2, 112]]}, {"zh": "得着一两位这种朋友，便算人生大幸福之一。", "ko": "이런 친구를 한두 명이라도 얻을 수 있다면 그것은 인생의 큰 행복 가운데 하나라고 할 수 있다.", "spans": [[0, 2, 109]]}, {"zh": "我想只要你肯找，断不会找不出来。", "ko": "나는 당신이 친구를 기꺼이 찾으려 한다면 반드시 찾지 못할 리가 없다고 생각한다.", "spans": []}, {"zh": "我说的这四件事，虽然像是老生常谈，但恐怕大多数人都不曾会这样做。", "ko": "내가 말한 이 네 가지 방법이 비록 나이든 서생의 상투적인 말 같지만 아마도 대부분의 사람들은 실제로 그렇게 해 본적이 없을 것이다.", "spans": []}, {"zh": "唉！世上人多么可怜啊！有这种不假外求不会蚀本不会出毛病的趣味世界，竟自没有几个人肯来享受！古书说的故事“野人献曝”；", "ko": "아, 세상 사람들은 얼마나 가련한가! 이렇게 외부로부터 구할 필요가 없고 손해 보지도 않고 탈도 나지 않는 재미의 세계가 있는데도 이것을 즐기려는 사람이 뜻밖에도 몇 없다. 옛 이야기에 “촌사람이 햇볕을 바치다”는 말이 있다.", "spans": [[20, 2, 116], [52, 4, 117]]}, {"zh": "我是尝冬天晒太阳的滋味尝得舒服透了，不忍一人独享，特地恭恭敬敬的来告诉诸君。", "ko": "나는 겨울에 햇볕 쬐는 맛을 아주 흐뭇하게 맛보았기에 차마 혼자만 누릴 수 없어, 특별히 공손하게 여러분께 알려 드리는 것이다.", "spans": []}, {"zh": "诸君或者会欣然采纳吧？但我还有一句话：太阳虽好，总要诸君亲自去晒，旁人却替你晒不来。", "ko": "여러분은 아마 흔쾌히 받아들이겠지요? 하지만 한 마디 더 하자면, 태양이 아무리 좋아도 반드시 여러분이 직접 가서 쬐어야 하며, 다른 사람이 대신 쬐어 줄 수는 없다.", "spans": [[2, 2, 101]]}]}, {"key": "月迹", "title": "月迹", "author": "贾平凹", "items": [{"zh": "我们这些孩子，什么都觉得新鲜，常常又什么都觉得不满足。", "ko": "우리 같은 아이들은 무엇이든 신기하게 느끼면서도, 또 무엇이든 늘 만족하지 못한다.", "spans": []}, {"zh": "中秋的夜里，我们在院子里盼着月亮，好久却不见出来，便坐回中堂里，放了竹窗帘儿闷着，缠奶奶说故事。", "ko": "추석날 밤, 우리는 마당에서 달을 기대했지만 한참을 기다려도 나오지 않자 거실로 들어가 앉아서 대나무 발을 내려놓고 할머니에게 옛날 이야기를 해 달라고 졸랐다.", "spans": [[41, 1, 118]]}, {"zh": "奶奶是会说故事的，说了一个，还要再说一个……奶奶突然说：“月亮进来了!”", "ko": "할머니는 이야기를 잘하셔서, 하나를 해 주시면 또 하나를 더 해 달라고 했다…… 할머니가 갑자기 말씀하셨다. \"달이 들어왔구나!\"", "spans": []}, {"zh": "我们看时，那竹窗帘儿里，果然有了月亮，款款地，悄没声儿地溜进来，出现在窗前的穿衣镜上了：", "ko": "우리가 봤을 때, 그 대나무 발 안으로 정말 달빛이 천천히 소리 없이 슬그머니 들어와 창문 앞 큰 거울 위로 나타났다.", "spans": [[19, 3, 119]]}, {"zh": "原来月亮是长了腿的，爬着那竹帘格儿，先是一个白道儿，再是半圆，渐渐地爬得高了，穿衣镜上的圆便满盈了。", "ko": "알고 보니 달은 다리가 달려서 대나무 발을 타고 기어오르는데 처음에는 한 줄의 흰 선이었다 반원형이 되고, 점점 높이 기어올라 큰 거울 안에서 가득 차서 둥글게 되었다.", "spans": []}, {"zh": "我们都高兴起来，又都屏气儿不出，生怕那是个尘影儿变的，会一口气吹跑呢。", "ko": "우리는 모두 기뻐하면서도 숨을 죽이고 내쉬지 않았다. 그것이 먼지 그림자가 변한 것이어서 한 번 숨을 내쉬면 날아가 버릴까 봐 몹시 걱정되었기 때문이다.", "spans": [[10, 3, 120], [16, 2, 121]]}, {"zh": "月亮还在竹帘儿上爬，那满圆却慢慢儿又亏了，缺了；", "ko": "달은 여전히 대발 위를 기어가고 있었지만, 그 꽉 찬 동그라미는 오히려 천천히 다시 이지러지고 줄어들었다.", "spans": []}, {"zh": "末了，便全没了踪迹，只留下一个空镜，一个失望。", "ko": "끝내는 자취가 완전히 사라지고, 빈 거울 하나와 실망 하나만 남았다.", "spans": [[0, 2, 122]]}, {"zh": "奶奶说：“它走了，它是匆匆的；你们快出去寻月吧。”", "ko": "할머니가 “달은 갔단다, 달은 바쁘거든. 너희들 얼른 나가 달을 찾아보렴.” 하고 말씀하셨다.", "spans": []}, {"zh": "我们就都跑出门去，它果然就在院子里，但再也不是那么一个满满的圆了，满院子的白光，是玉玉的、银银的，灯光也没有这般儿亮的。", "ko": "우리는 모두 문밖으로 뛰어나갔다. 달은 과연 마당에 있었지만, 더 이상 그렇게 꽉 찬 동그라미가 아니었다. 마당 가득한 흰 빛은 옥처럼, 은처럼 빛났고, 등불도 이렇게 밝지는 않았다.", "spans": []}, {"zh": "院子中央处，是那棵粗粗的桂树，疏疏的枝，疏疏的叶，桂花还没有开，却有了累累的骨朵儿了。", "ko": "마당 가운데 그 굵은 계수나무는 듬성듬성한 가지와 성긴 잎에 꽃은 아직 피지 않았으나 봉오리들이 주렁주렁 가득했다.", "spans": [[35, 2, 123], [38, 3, 124]]}, {"zh": "我们都走近去，不知道那个满圆儿去哪儿了，却疑心这骨朵儿是繁星儿变的；", "ko": "우리는 가까이 다가갔고 그 둥근 달이 어디로 갔는지 알 수 없었지만 이 봉오리들이 별들이 변한 것 같다고 의심했다.", "spans": [[24, 3, 124]]}, {"zh": "抬头看着天空，星儿似乎就比平日少了许多。", "ko": "고개를 들어 하늘을 보니 별이 평소보다 훨씬 적어 보였다.", "spans": []}, {"zh": "月亮正在头顶，明显大多了，也圆多了，清清晰晰看见里边有了什么东西。", "ko": "달은 머리 위에 떠 있었고 확실히 훨씬 크고 둥글었고 그 안에 무엇인가 있는 것이 뚜렷하게 보였다.", "spans": []}, {"zh": "“奶奶，那月上是什么呢?” 我问。", "ko": "“할머니, 달 위에 있는 건 뭐예요?” 내가 물었다.", "spans": []}, {"zh": "“是树，孩子\" 奶奶说。", "ko": "“나무란다, 얘야.” 할머니가 말씀하셨다.", "spans": []}, {"zh": "“什么树呢? ” “桂树。”", "ko": "“무슨 나무예요?” “계수나무.”", "spans": []}, {"zh": "我们都面面相觑了，倏忽间，哪儿好像有了一种气息，就在我们身后袅袅，到了头发梢儿上，添了一种淡淡的痒痒的感觉；", "ko": "우리는 서로 얼굴을 마주보았고 갑자기 어디선가 숨결같은 것이 느껴졌는데 우리 바로 뒤에서 머리카락 끝에 이르자 가볍고 간질간질함을 주었다.", "spans": [[3, 4, 125], [9, 2, 126], [30, 2, 127]]}, {"zh": "似乎我们已在月里了，那月桂分明就是我们身后的这一棵了。", "ko": "마치 우리가 이미 달 속에 있는 것 같았고, 그 달의 계수나무는 분명 우리 뒤에 있는 바로 이 나무였다.", "spans": []}, {"zh": "奶奶瞧着我们，就笑了：“傻孩子，那里边已经有人了呢。”", "ko": "할머니는 우리를 보며 웃으셨다. “녀석들, 그 안에는 이미 사람이 있단다.”", "spans": []}, {"zh": "“谁?” 我们都吃惊了。 “嫦娥。” 奶奶说。", "ko": "“누구요?” 우리가 깜짝 놀랐다. “상아란다.” 할머니가 말씀하셨다.", "spans": []}, {"zh": "“嫦娥是谁?”  “一个女子。” 哦，一个女子。", "ko": "“상아가 누구예요?” “한 여자란다.” “오, 한 여자구나.”", "spans": []}, {"zh": "我想：月亮里，地该是银铺的，墙该是玉砌的，那么好个地方，配住的一定是十分漂亮的女子了。", "ko": "나는 달 속에서는 땅은 은으로 깔았고 담장은 옥으로 쌓았을 것이고 그렇게 좋은 곳에 어울리는 사람은 매우 아름다운 여자일 것이라고 생각했다.", "spans": []}, {"zh": "“有三妹漂亮吗?” “和三妹一样漂亮的。”", "ko": "“셋째 누이만큼 예뻐요?” “셋째 누이만큼 예쁘단다.”", "spans": []}, {"zh": "三妹就乐了：“啊啊，月亮是属于我的了!”", "ko": "셋째 누이는 신이 났다. “아아, 달은 내 것이구나!”", "spans": []}, {"zh": "三妹是我们中最漂亮的，我们都羡慕起来；", "ko": "셋째 누이는 우리 중 제일 예뻐서 우리는 모두 부러워하기 시작했다.", "spans": []}, {"zh": "看着她的狂样儿，心里却有了一股儿的嫉妒。", "ko": "그녀가 거들먹거리는 모습을 보니 마음속에서 질투심이 생겼다.", "spans": []}, {"zh": "我们便争执了起来，每个人都说月亮是属于自己的。", "ko": "모두 달이 자기의 것이라고 입씨름을 하기 시작했다.", "spans": []}, {"zh": "奶奶从屋里端了一壶甜酒出来，给我们每人倒了一小杯儿，说：“孩子们，瞧瞧你们的酒杯，你们都有一个月亮哩!”", "ko": "할머니가 방에서 단술 한 주전자를 들고 나와 우리 모두에게 작은 잔으로 한 잔씩 따라 주시며 말씀하셨다. \"얘들아, 너희 술잔을 보렴. 너희 모두 달을 하나씩 가졌구나!\"", "spans": []}, {"zh": "我们都看着那杯酒，果真里边就浮起一个小小的月亮的满圆。", "ko": "우리는 술잔을 바라보았고 정말 그 안에 작은 둥근 달이 떠 있었다.", "spans": []}, {"zh": "捧着，一动不动的，手刚一动，它便酥酥地颤，使人可怜儿的样子。", "ko": "두 손으로 받쳐 들고 꼼짝도 하지 않다가, 손이 조금 움직이기만 하면 달은 바르르 떨려서 가련해 보였다.", "spans": []}, {"zh": "大家都喝下肚去，月亮就在每一个人的心里了。", "ko": "모두 그것을 마시니 달은 모두의 마음속에 있게 되었다.", "spans": []}, {"zh": "奶奶说：“月亮是每个人的，它并没走，你们再去找吧。”", "ko": "할머니께서 “달은 모두의 것이란다. 달은 간 게 아니니 찾아보렴.”하고 말씀하셨다.", "spans": []}, {"zh": "我们越发觉得奇了，便在院里找起来。", "ko": "우리는 더욱 신기하게 느껴져 마당에서 달을 찾기 시작했다.", "spans": []}, {"zh": "妙极了，它真没有走去，我们很快就在葡萄叶儿上，瓷花盆儿上，爷爷的锨刃儿上发现了。", "ko": "정말 신기하게도, 달은 진짜 가지 않았다. 우리는 금새 포도 나무 위, 자기 화분 위, 할아버지의 삽날 위에서 달을 발견했다.", "spans": [[32, 2, 128]]}, {"zh": "我们来了兴趣，竟寻出了院门。", "ko": "우리는 흥이 나서 마침내 대문 밖까지 찾아 나섰다.", "spans": []}, {"zh": "院门外，便是一条小河。", "ko": "마당 문 밖에는 작은 개울이 하나 있었다.", "spans": []}, {"zh": "河水细细的，却漫着一大片的净沙；", "ko": "개울은 좁았지만 깨끗한 모래가 넓게 펼쳐져있었다.", "spans": []}, {"zh": "全没白日那么的粗糙，灿灿地闪着银光，柔柔和和地像水面了。", "ko": "낮의 거친 모습은 전혀 없이 반짝반짝 은빛으로 빛나며, 부드러운 것이 마치 수면 같았다.", "spans": []}, {"zh": "我们从沙滩上跑过去，弟弟刚站到河的上湾，就大呼小叫了：“月亮在这儿!”", "ko": "우리는 모래밭 위를 뛰어 건너갔는데 동생이 개울의 윗쪽에 서서 “달이 여깄어!” 라고 소리쳤다.", "spans": []}, {"zh": "妹妹几乎同时在下湾喊道：“月亮在这儿!”", "ko": "여동생도 거의 동시에 아랫쪽에서 “달이 여깄어!”라고 외쳤다.", "spans": []}, {"zh": "我两处去看了，两处的水里都有月亮，沿着河沿跑，而且哪一处的水里都有月亮了。", "ko": "나는 두 곳을 다 가 보았는데 양쪽의 물속 모두 달이 있었고 게다가 내가 개울을 따라 달려갔는데 어느 곳의 물에도 달이 있었다.", "spans": []}, {"zh": "我们都看着天上，我突然又在弟弟妹妹的眼睛里看见了小小的月亮。", "ko": "우리는 모두 하늘을 바라보았고 나는 남동생과 여동생의 눈 속에서 작은 달을 보았다.", "spans": []}, {"zh": "我想，我的眼睛里也一定是会有的。", "ko": "나는 내 눈에도 틀림없이 달이 있을 것이라고 생각했다.", "spans": []}, {"zh": "噢，月亮竟是这么多的：只要你愿意，它就有了哩。", "ko": "아, 달은 뜻밖에도 이렇게나 많구나. 네가 원하기만 하면 달은 있는 거야.", "spans": []}, {"zh": "我们就坐在沙滩上，掬着沙儿，瞧那光辉，我说：“你们说，月亮是个什么呢?”", "ko": "우리는 모래밭에 앉아 모래를 움켜쥐고 그 빛을 바라보다가 “너네들 달이 뭔지 말해봐?” 라고 말했다.", "spans": [[16, 2, 129]]}, {"zh": "“月亮是我所要的。”弟弟说。 “月亮是个好。”妹妹说。我同意他们的话。", "ko": "“달은 내가 갖고 싶은 거야.” 남동생이 말했다. “달은 좋은 거야.” 여동생이 말했다. 나는 그들의 말에 동의했다.", "spans": []}, {"zh": "正像奶奶说的那样：它是属于我们的，每个人的。", "ko": "정말로 할머니께서 말씀하신 것처럼 달은 우리 모두의 것이야.", "spans": []}, {"zh": "我们就又仰起头来看那天上的月亮，月亮白光光的，在天空上。", "ko": "우리는 다시 고개를 들고 하늘의 달을 쳐다보았다. 달은 하얗게 빛나며 하늘 위에 있었다.", "spans": []}, {"zh": "我突然觉得，我们有了月亮，那无边无际的天空也是我们的了，那月亮不是我们按在天空上的印章吗?", "ko": "나는 갑자기 우리가 달을 가졌다면 저 끝없는 하늘도 우리의 것이고 저 달은 우리가 하늘에 찍어둔 도장이 아닌가하고 생각했다.", "spans": []}, {"zh": "大家都觉得满足了，身子也来了困意，就坐在沙滩上，相依相偎地甜甜地睡了一会儿。", "ko": "우리 모두가 만족했고 졸음도 몰려와 우리는 모래밭에 앉아서 서로서로 기대어서 달게 한 숨을 잤다.", "spans": []}]}, {"key": "过好日子", "title": "过好日子是一种能力", "author": "陈彤", "items": [{"zh": "做一个穷人，最大的乐趣就是嘲笑那些过上好日子的人“累得跟驴似的”。", "ko": "가난한 사람에게 가장 큰 즐거움은 잘 사는 사람들을 “당나귀처럼 피곤하게 산다”라고 비웃는 것이다.", "spans": []}, {"zh": "很早的时候，读过一则《伊索寓言》，上面说一只蝉到了冬天很饿，就去请求蚂蚁给它点食物。", "ko": "예전에 <<이솝우화>>를 한 편 읽은 적이 있는데 거기에서 매미 한 마리가 겨울이 되어 배가 고프자 개미에게 가서 자신에게 먹을 걸 좀 달라고 부탁했다.", "spans": [[22, 1, 131]]}, {"zh": "蚂蚁问它：“你夏天干什么去了？”", "ko": "개미가 “너 여름에 뭐하고 지냈어?”라고 물었다.", "spans": []}, {"zh": "蝉说：“我一个夏天都在唱歌。”", "ko": "매미가 “나는 여름 내내 노래를 했지.”", "spans": [[0, 1, 131]]}, {"zh": "蚂蚁说：“既然这样，你为什么不在冬天的时候跳舞呢？”", "ko": "개미가 “그렇다면 겨울에는 왜 춤을 추지 않는 거니?”", "spans": []}, {"zh": "我觉得很多人在年轻的时候非常像唱歌的蝉，看不起辛苦工作的蚂蚁。", "ko": "나는 많은 사람들이 젊었을 때는 노래하는 매미를 아주 닮아서 힘들게 일하는 개미를 업신여긴다고 생각한다.", "spans": [[18, 1, 131]]}, {"zh": "觉得它们太实际、太庸俗、太操劳，而且蚂蚁的生活理想也太不值得一提。", "ko": "그들은 너무 현실적이고 저속하고 너무 힘들게 산다고 생각한다. 게다가 개미의 삶의 이상은 언급할 가치조차 없다고 생각한다.", "spans": [[9, 2, 139]]}, {"zh": "我们在年轻的时候，认为好日子应该是载歌载舞的日子，像彩蝶飞舞一样轻松快乐。", "ko": "우리는 젊었을 때 좋은 날이란 노래하고 춤추는 날, 화려한 나비가 날며 춤추듯 홀가분하고 즐거운 날이어야 한다고 여긴다.", "spans": []}, {"zh": "我们不需要钱，也不需要服从谁，我们工作只是为了喜欢，我们甚至从不储蓄，以为那是像蚂蚁一样的小市民做的事情。", "ko": "우리는 돈도 필요 없고 아무에게 복종할 필요도 없으며 우리가 일하는 것은 단지 일을 좋아해서 하는 것이고 심지어 저축은 한 적도 없고 그것은 개미와 같은 소시민의 일이라고 여겼다.", "spans": [[32, 2, 137]]}, {"zh": "其实，人生的夏天很快就会过去。", "ko": "사실 인생의 여름은 금방 지나간다.", "spans": []}, {"zh": "如果要过上好日子，我们必须在冬天来临之前找到新的赢利模式。", "ko": "만약 좋은 삶을 살고자 한다면 우리는 반드시 겨울이 오기 전에 새로운 수익 창출의 방식을 찾아야 한다.", "spans": [[26, 2, 144]]}, {"zh": "我不反对在夏天唱歌跳舞，但是我认为如果要把“好日子”作为一种生活目标，那么必须在夏末秋初的时候开始筹备，实现个人生活方式转型。", "ko": "나는 여름에 춤추고 노래하는 걸 반대하지 않는다. 하지만 나는 만약 “좋은 생활”을 생활의 목표로 삼는다면 반드시 여름 끝과 가을 초에 준비를 시작해 개인의 삶의 방식의 전환을 이루어야 한다고 생각한다.", "spans": [[49, 2, 142]]}, {"zh": "这个“夏末秋初”我理解大约应该是27岁以后到36岁之前，这个时候无论男女，都还谈得上年轻，但又比更年轻的蝉多了一些经验，比已经很实际的蚂蚁多了一些激情", "ko": "이 ‘여름 끝, 가을 시작’은 대략 27세 이후에서 36세 이전까지라고 이해하고 있다. 이 시기는 남녀를 불문하고 아직 젊다고 할 수 있다. 그렇지만 더 젊은 매미보다는 경험이 조금 더 많고 이미 아주 현실적인 개미보다는 열정이 조금 더 많다.", "spans": [[52, 1, 131]]}, {"zh": "这个时候是奠定好日子三大基础—财富、事业、家庭的最好时机。", "ko": "이 시기는 좋은 날의 3대 기초 ― 재산, 일, 가정 ― 를 다지기에 가장 좋은 시기다.", "spans": [[5, 2, 134]]}, {"zh": "这是很关键的一个时期，并不是说这个时期没有过好，就与好日子失之交臂；", "ko": "이것은 아주 중요한 시기이다. 하지만 이 시기를 잘 보내지 못하면 좋은 삶을 눈앞에서 놓친다는 말은 결코 아니다.", "spans": []}, {"zh": "而是说这个时候如果没有什么大的意外的话，那么一个人将就此成熟起来，并且能够迅速掌握一种过好日子的能力。", "ko": "오히려 이 시기에 만약 큰 이변이 없다면 사람이 이때부터 성숙해지고 아울러 빨리 좋은 날을 보낼 수 있는 능력을 터득하게 된다.", "spans": []}, {"zh": "这种能力是一种综合素质，具体来说它包含妥协与自知之明。", "ko": "이런 능력은 종합적인 자질로 구체적으로 말하자면 타협과 자신에 대한 정확한 인식을 포함하고 있다.", "spans": [[19, 2, 132]]}, {"zh": "我在很早的时候曾经采访过一个汽车设计师，如果我没有记错的话，大概是1996年或者1997年的一次车展上。", "ko": "나는 예전에 자동차 디자이너를 인터뷰한 적이 있는데 내 기억이 틀리지 않다면 아마 1996년이나 1997년의 모터쇼였을 것이다.", "spans": [[38, 2, 101]]}, {"zh": "我和这名非常年轻而且有才华的奥迪设计师相遇，他当时为车展设计了一款概念车。", "ko": "나는 아주 젊고 재능 있는 이 아우디 디자이너와 만났는데, 그는 당시 모터쇼를 위해 콘셉트카 한 대를 디자인했다.", "spans": [[32, 1, 140], [33, 2, 138]]}, {"zh": "我问他作为一个优秀的汽车设计师最重要的素质是什么？", "ko": "나는 그에게 우수한 자동차 디자이너로서 가장 중요한 자질이 무엇인지 물었다.", "spans": []}, {"zh": "他说：“是妥协。如果没有妥协，就不会有任何新款问世。”", "ko": "그가 “타협입니다. 만약에 타협이 없다면 어떠한 새로운 모델도 세상에 나오지 못 할 것입니다.”라고 말했다.", "spans": [[5, 2, 132], [12, 2, 132], [22, 1, 140]]}, {"zh": "我那时很惊讶，以为他会跟我强调创造呀个性呀什么的，哪里想到他会说出“妥协”。", "ko": "나는 그때 매우 놀랐다. 그가 창의니 개성이니 그런 것들을 강조할 줄 알았지 어디 ‘타협’이라고 말할 줄 생각을 했겠는가?", "spans": [[34, 2, 132]]}, {"zh": "不过他说的妥协不是没有原则的唯唯诺诺；而是建立在有自知之明的基础上的。", "ko": "그러나 그가 말한 타협은 원칙 없이 그저 예예하는 것이 아니라 자신을 정확히 인식한 기초 위에 세워진 것이다.", "spans": [[5, 2, 132]]}, {"zh": "中国有句古话，叫“人贵有自知之明”。", "ko": "중국에는 “사람은 자기 자신을 정확하게 아는 능력이 중요하다”라는 옛말이 있다.", "spans": []}, {"zh": "以前不明白，觉得自知之明不就是知道自己姓什么一顿吃几碗干饭吗？有什么难的？", "ko": "예전에는 잘 몰랐다. ‘자신을 정확하게 안다는 것’이란 자기 성이 무엇인지 한 끼에 밥을 몇 그릇 먹는지 아는 것이라고 생각했다. 그게 뭐가 어려울까?", "spans": []}, {"zh": "后来才知道，人在年轻气盛的时候，多半是很难客观准确地对待自己的。", "ko": "사람이 젊고 혈기왕성할 때 대부분이 자기자신을 객관적이고 정확하게 대하는 것아 어렵다는 것을 나중에서야 알게되었다.", "spans": []}, {"zh": "大抵男的都以为自己是未来的毕加索，成名以前的比尔•盖茨：", "ko": "대체로 남자들은 자신이 미래의 피카소이거나 유명해지기 이전의 빌 게이츠라고 여긴다.", "spans": [[0, 2, 145]]}, {"zh": "但凡女的都以为自己是貂蝉转世或者是倾国倾城的罗敷妹妹。", "ko": "하지만 여자라면 누구나 다 자신이 초선의 환생이거나 경국지색의 나부 아가씨라고 여긴다.", "spans": [[10, 1, 143], [11, 1, 131], [14, 2, 101]]}, {"zh": "这样的时候，谁肯妥协？", "ko": "이럴 때에는 누가 타협을 하려고 하겠는가?", "spans": [[8, 2, 132]]}, {"zh": "于是，对待金钱的态度就是对待粪土的态度，对待领导的态度就是“安能摧眉折腰事权贵，使我不得开心颜”。", "ko": "이에 돈에 대한 태도가 하찮게 여기는 태도이고 상사에 대한 태도는 “어찌 자신의 몸을 낮춰 권문세족을 섬기면서 자신의 심신을 편안치 않게 하랴”라는 태도인 것이다.", "spans": []}, {"zh": "而对待工作的态度则是想不干就不干—“人生在世不称意，明朝散发弄扁舟”。", "ko": "그러나 일에 대한 태도는 하고 싶지 않으면 바로 그만 두고 “사람이 세상을 살면서 마음과 맞지 않는다면 내일 아침 머리를 풀어해치고 작은 배를 띄우리라”라는 것이었다.", "spans": [[31, 2, 22]]}, {"zh": "当然，他们对待爱情和朋友也不会有太珍惜的感觉—“天涯何处无芳草”！", "ko": "물론 그들은 친구와 애정에 대해서도 그다지 소중함이 없다 ― “세상 어디든지 향기로운 풀은 있다!”", "spans": []}, {"zh": "“好日子”不是耍大牌。什么叫“妥协”？", "ko": "‘좋은 삶’은 거드름을 피우는 것이 아니다. 무엇을 ‘타협’이라고 하는가?", "spans": [[15, 2, 132]]}, {"zh": "妥协不是简单的让步、放弃，而是在知己知彼的基础上达成一种共识。", "ko": "타협은 단순히 양보하고 포기하는 것이 아니라 자신과 상대를 아는 기초 위에서 공감대를 이루는 것이다.", "spans": [[0, 2, 132]]}, {"zh": "无论是工作还是生活，妥协不仅是为了“安定团结”，“家和万事兴”，而且潜藏着一种坚持，", "ko": "일이나 생활을 막론하고 타협은 ‘안정과 결속’, ‘가화만사성’을 위한 것일 뿐만 아니라 굳건한 지킴이 숨어 있다.", "spans": [[10, 2, 132]]}, {"zh": "这种坚持可以被理解为一种坚定的决心—无论怎样，我们都要把事情做成；无论怎样，我们都要把日子过好。", "ko": "이러한 굳건한 지킴은 무슨 일이 있어도 일을 해내고 무슨 일이 있더라도 좋은 삶을 살아내겠다는 굳은 결심이다.", "spans": []}, {"zh": "我可以妥协，直到达成协议。", "ko": "나는 협의에 이를 때까지 타협할 수 있다.", "spans": [[3, 2, 132]]}, {"zh": "在招聘广告上，很多公司都会列出一条“有五年以上工作经验者优先”。", "ko": "채용 광고에는 많은 회사가 “5년 이상 업무 경험자 우대”라는 항목을 넣는다.", "spans": []}, {"zh": "你以为他只是单纯地在强调工作经验吗？", "ko": "당신은 단순히 업무 경험을 강조하는 것이라고 생각하는가?", "spans": []}, {"zh": "一个经营装修公司的朋友跟我说，其实装修做一年的经验和做五年的差不多。", "ko": "인테리어 회사를 경영하는 친구가 내게 말하기를 사실 인테리어 경력은 1년이나 5년이나 별 차이가 없다고 했다.", "spans": []}, {"zh": "但是如果一个人有五年工作经验，他就会明白他不能在我的公司实现他做贝聿铭的理想。", "ko": "그러나 만약 어떤 사람이 5년간의 경력이 있다면 그는 내 회사에서 베이위밍(유명 건축가)의 이상을 실현할 수 없다는 것을 잘 알 것이다.", "spans": []}, {"zh": "他要是贝聿铭，他早就找到成为贝聿铭的方法了，还等着我来发现他挖掘他？", "ko": "그가 만약 베이위밍이라면 그 사람이 진작에 베이위밍이 될 방법을 찾았을 것이지 내가 발견해주기를 기다리지는 않을 것이다.", "spans": []}, {"zh": "他不会在我的公司抱怨我没有给他条件，我凭什么给他条件？我给我自己条件好不好？", "ko": "그는 내 회사에서 내가 자기에게 여건을 마련해 주지 않는다고 불평하지 않을 것이다. 내가 무슨 근거로 그에게 여건을 마련해 주겠는가? 내가 나 자신에게 여건을 주는 게 낫지 않겠는가?", "spans": []}, {"zh": "一般工作五年以上的人，会懂得把哪些梦想藏在心中。", "ko": "일반적으로 5년 이상 일한 사람은 어떤 꿈은 마음속에 숨겨야 한다는 것을 알고 있다.", "spans": []}, {"zh": "而且一般比较清楚通过努力自己能够得到什么样的工作和生活。", "ko": "게다가 일반적으로 노력을 통해서 자신이 어떤 일과 삶을 얻을 수 있는지 비교적 명확하게 알고 있다.", "spans": []}, {"zh": "他会算得清清楚楚，自己几年之后可以买车，几年之后可以买房。", "ko": "그는 자신이 몇 년 뒤에 차를 사고 몇 년 뒤에 집을 살 수 있다는 것을 명확하게 계산할 수 있다.", "spans": []}, {"zh": "为什么西方一些企业在提拔主管的时候会考虑一个人的婚姻状况？", "ko": "왜 서양의 일부 기업들이 책임자를 선발할 때 그 사람의 혼인 상태를 고려할까?", "spans": []}, {"zh": "因为企业一般认为结了婚的人比未婚的人更有责任感。", "ko": "기업은 일반적으로 기혼자가 미혼자에 비해서 더욱 더 책임감이 있다고 생각하기 때문이다.", "spans": []}, {"zh": "而事实上，是结了婚的人比未婚的人更懂得妥协。", "ko": "그리고 사실상 기혼자가 미혼자보다 더 타협 할 줄 안다.", "spans": [[19, 2, 132]]}, {"zh": "想一想，工作不是和婚姻有很类似的地方吗？", "ko": "생각해보아라, 일이라는 것이 결혼과 매우 유사한 점이 있지 않은가?", "spans": []}, {"zh": "一桩婚姻要持久有效，难道能不学会自己给自己搬梯子，找台阶？", "ko": "결혼 생활이 오래 유효하려면, 스스로 자신에게 사다리를 놓아 주고 내려올 계단을 찾는 법(=체면을 지키며 물러서는 법)을 배우지 않을 수 있겠는가?", "spans": []}, {"zh": "要不，真僵住了，一个说“离”，一个说“好”，怎么办？真离了？那还过什么日子呀？", "ko": "그렇지 않으면 진짜 서로 의견이 대립이 되었을 때 한쪽이 “헤어져” 하고 다른 한 쪽이 “좋아”라고 하면 어떻게 되겠는가? 정말 헤어지나? 그럼 또 어떠한 삶을 살겠는가?", "spans": []}, {"zh": "工作也是一样，除非是你不想干了，否则老板说你两句，你脖子一梗，说“老子不干了”，然后呢？", "ko": "일도 마찬가지다. 정말 그만둘 생각이 아니고서야 사장이 몇 마디 했다고 목을 빳빳하게 하고 “나 안 해!”라고 한다면 그 다음은 어떻게 되겠는가?", "spans": [[29, 1, 133]]}, {"zh": "可不能图一时痛快呀！", "ko": "한 순간의 통쾌함만을 도모해서는 안 된다.", "spans": []}, {"zh": "好日子是怎么出来的？是过出来的。知道什么叫“过”吗？", "ko": "잘 산다는 것은 어떻게 만들어지는가? 하루하루 겪어서 만들어지는 것이다. ‘겪는다’는 게 무슨 말인지 아는가?", "spans": []}, {"zh": "“过”就是“错”的意思，一点一点地错，最后就错出一个好日子来了！", "ko": "‘겪는다’는 것은 ‘어긋나다’는 뜻이다. 조금씩 어긋나다가 마침내 잘 사는 것으로 되는 것이다!", "spans": []}, {"zh": "当然你可以选择不妥协，像贝多芬那样，像布鲁诺那样，像许许多多的英雄那样，即使被五马分尸、被绑在火刑架上也不妥协，但是那和好日子没有关系。", "ko": "물론 당신이 베토벤, 브루노같은 수많은 영웅들처럼 타협하지 않기를 선택할 수도 있다. 설사 거열형을 당하거나 화형대에 묶여도 타협하지 않을 수 있다. 그러나 그것은 ‘좋은 날’을 사는 것과는 관계가 없다.", "spans": [[8, 2, 132], [53, 2, 132]]}, {"zh": "好日子讲究的是“小不忍则乱大谋”。", "ko": "좋은 날을 사는 데 주의를 기울이는 것은 “작은 일을 참지 않으면 큰 계획을 어지럽히게 된다”는 것이다.", "spans": []}]}];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const marks = store.get('gj-marks', {});      // sentence id -> ok|mid|bad
const dzMarks = store.get('gj-dz', {});       // q index -> 1/0
let tab = 'tr', filter = store.get('gj-filter', 'all'), idx = 0, order = [], revealed = false;
const drafts = store.get('gj-drafts', {});   // sentence id -> my translation
const dzWrong = store.get('gj-dzw', {});      // q index -> my wrong answer
const missCount = store.get('gj-miss', {});   // id -> times wrong

const ALL = [];
DATA.forEach(t => t.items.forEach((it, i) => ALL.push({ ...it, id: t.key + ':' + i, key: t.key, title: t.title, author: t.author, n: i + 1, total: t.items.length })));

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildFilters() {
  const f = $('filters');
  const list = [{ key: 'all', label: '전체', n: ALL.length }].concat(DATA.map(t => ({ key: t.key, label: t.title, n: t.items.length, zh: true })));
  f.innerHTML = list.map(o => `<button class="chip" data-k="${o.key}" aria-pressed="${filter === o.key}">${o.zh ? `<span class="zh">${esc(o.label)}</span>` : o.label}<small>${o.n}</small></button>`).join('');
  f.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.k; store.set('gj-filter', filter); buildFilters(); rebuild(); });
}

function pool() {
  if (tab === 'tr') {
    let p = ALL.filter(s => filter === 'all' || s.key === filter);
    if ($('opt-retry').checked) p = p.filter(s => marks[s.id] === 'bad' || marks[s.id] === 'mid');
    return p.map(s => s.id);
  }
  let d = DZ.map((q, i) => i).filter(i => filter === 'all' || DZ[i].key === filter);
  if ($('opt-retry').checked) d = d.filter(i => dzMarks[i] === 0);
  return d;
}
function rebuild() {
  if (tab === 'note') { order = []; idx = 0; render(); return; }
  order = pool();
  if ($('opt-shuffle').checked) shuffle(order);
  idx = 0; revealed = false; render();
}

function sentHTML(s) {
  let out = '', p = 0;
  s.spans.forEach(([st, len, wi]) => {
    out += esc(s.zh.slice(p, st));
    out += `<span class="w" tabindex="0" data-w="${wi}">${esc(s.zh.substr(st, len))}</span>`;
    p = st + len;
  });
  return out + esc(s.zh.slice(p));
}

function renderTr() {
  const v = $('view-tr');
  if (!order.length) {
    v.innerHTML = `<div class="empty">${$('opt-retry').checked ? '오답이 없습니다. 채점에서 ‘애매’나 ‘다시’를 누른 문장이 여기에 모입니다.' : '문장이 없습니다.'}</div>`;
    return;
  }
  const s = ALL.find(x => x.id === order[idx]);
  const m = marks[s.id];
  const stLabel = m === 'ok' ? '<span class="state ok">● 맞음</span>' : m === 'mid' ? '<span class="state mid">● 애매</span>' : m === 'bad' ? '<span class="state bad">● 다시</span>' : '';
  v.innerHTML = `

    <div class="gloss" id="gloss"></div>

    <div class="ref" id="ref" ${revealed ? '' : 'hidden'}><span class="lbl">참고 해석</span>${esc(s.ko)}</div>

        ${revealed ? `<button class="btn g-ok" data-g="ok">1 맞음</button><button class="btn g-mid" data-g="mid">2 애매</button><button class="btn g-bad" data-g="bad">3 다시</button>`
                   : `<button class="btn primary" id="show">해석 보기</button>`}
      </div>
      <button class="btn" id="next" aria-label="다음 문장">다음 →</button>
    </div>`;
  const ta = $('mine'); ta.value = drafts[s.id] || ''; ta.oninput = () => { drafts[s.id] = ta.value; store.set('gj-drafts', drafts); };
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); reveal(); } };
  v.querySelectorAll('.w').forEach(el => {
    const fn = () => { if (!$('opt-hint').checked) return; toggleGloss(s, +el.dataset.w); };
    el.onclick = fn; el.onkeydown = e => { if (e.key === 'Enter') fn(); };
  });
  if ($('show')) $('show').onclick = reveal;
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(s.id, b.dataset.g));
  $('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
  drawGloss(s);
}
const openGloss = new Set();
function toggleGloss(s, wi) {
  const key = wi; openGloss.has(key) ? openGloss.delete(key) : openGloss.add(key);
  drawGloss(s);
}
function drawGloss(s) {
  const g = $('gloss'); if (!g) return;
  const ids = [...new Set(s.spans.map(x => x[2]))].filter(i => openGloss.has(i));
  g.innerHTML = ids.map(i => { const w = WORDS[i]; return `<span><b>${esc(w.hz)}</b><em>${esc(w.py)}</em>${esc(w.kr)}</span>`; }).join('');
}
function reveal() { if (revealed) return; revealed = true; renderTr(); }
function grade(id, g) {
  marks[id] = g; store.set('gj-marks', marks);
  if (g !== 'ok') { missCount[id] = (missCount[id] || 0) + 1; store.set('gj-miss', missCount); }
  stats(); go(1);
}

function toneMark(syl) {
  // "zhao2" -> "zháo"; handles v/ü, tone 0/5 = neutral
  const m = syl.match(/^([a-zü]+)([0-5])$/); if (!m) return syl;
  let [, base, t] = m; t = +t; if (t === 0 || t === 5) return base;
  const marksMap = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
  let pos = base.indexOf('a'); if (pos < 0) pos = base.indexOf('e');
  if (pos < 0 && base.includes('ou')) pos = base.indexOf('o');
  if (pos < 0) { for (let i = base.length - 1; i >= 0; i--) if ('iouü'.includes(base[i])) { pos = i; break; } }
  if (pos < 0) return base;
  return base.slice(0, pos) + marksMap[base[pos]][t - 1] + base.slice(pos + 1);
}
function normPy(s) {
  s = s.toLowerCase().trim().replace(/v/g, 'ü').replace(/u:/g, 'ü').replace(/[\s'’·-]/g, '');
  s = s.replace(/([a-zü]+?)([0-5])/g, (all, b, t) => toneMark(b + t));
  return s.normalize('NFC');
}
